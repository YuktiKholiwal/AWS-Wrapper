AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role for Plot to manage static site resources in this account.

Parameters:
  PlotAccountId:
    Type: String
    Description: The AWS account ID that Plot runs under.
  ExternalId:
    Type: String
    Description: Per-user external ID to prevent confused deputy attacks.

Resources:
  PlotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "plot-cross-account-${ExternalId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${PlotAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: PlotResourceManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationStackManagement
                Effect: Allow
                Action:
                  - "cloudformation:CreateStack"
                  - "cloudformation:UpdateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:GetTemplate"
                Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/plot-site-*/*"
              - Sid: S3BucketManagement
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - "arn:aws:s3:::plot-site-*"
                  - "arn:aws:s3:::plot-site-*/*"
              - Sid: CloudFrontManagement
                Effect: Allow
                Action: "cloudfront:*"
                Resource: "*"
              - Sid: AcmCertificateManagement
                Effect: Allow
                Action:
                  - "acm:RequestCertificate"
                  - "acm:DescribeCertificate"
                  - "acm:DeleteCertificate"
                  - "acm:ListCertificates"
                Resource: "*"
              - Sid: CloudFrontServiceLinkedRole
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource: "arn:aws:iam::*:role/aws-service-role/cloudfront.amazonaws.com/*"
                Condition:
                  StringLike:
                    "iam:AWSServiceName": "cloudfront.amazonaws.com"

Outputs:
  RoleArn:
    Description: ARN of the Plot cross-account role. Paste this into Plot.
    Value: !GetAtt PlotRole.Arn
