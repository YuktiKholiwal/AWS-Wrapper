AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role for Plot to manage static site resources in this account.

Parameters:
  PlotAccountId:
    Type: String
    Description: The AWS account ID that Plot runs under.
  ExternalId:
    Type: String
    Description: Per-user external ID to prevent confused deputy attacks.

Resources:
  PlotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "plot-cross-account-${ExternalId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${PlotAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: PlotResourceManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationStackManagement
                Effect: Allow
                Action:
                  - "cloudformation:CreateStack"
                  - "cloudformation:UpdateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:GetTemplate"
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/plot-site-*/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/plot-fn-*/*"
              - Sid: S3BucketManagement
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - "arn:aws:s3:::plot-site-*"
                  - "arn:aws:s3:::plot-site-*/*"
              - Sid: CloudFrontManagement
                Effect: Allow
                Action: "cloudfront:*"
                Resource: "*"
              - Sid: AcmCertificateManagement
                Effect: Allow
                Action:
                  - "acm:RequestCertificate"
                  - "acm:DescribeCertificate"
                  - "acm:DeleteCertificate"
                  - "acm:ListCertificates"
                Resource: "*"
              - Sid: LambdaManagement
                Effect: Allow
                Action:
                  - "lambda:CreateFunction"
                  - "lambda:UpdateFunctionCode"
                  - "lambda:UpdateFunctionConfiguration"
                  - "lambda:DeleteFunction"
                  - "lambda:GetFunction"
                  - "lambda:InvokeFunction"
                  - "lambda:AddPermission"
                  - "lambda:RemovePermission"
                Resource: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function/plot-fn-*"
              - Sid: ApiGatewayManagement
                Effect: Allow
                Action: "apigateway:*"
                Resource: "*"
              - Sid: LambdaExecutionRole
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:DeleteRole"
                  - "iam:PutRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:PassRole"
                  - "iam:GetRole"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/plot-fn-*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:DeleteLogGroup"
                  - "logs:DescribeLogStreams"
                  - "logs:GetLogEvents"
                  - "logs:FilterLogEvents"
                Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/plot-fn-*:*"
              - Sid: DynamoDBManagement
                Effect: Allow
                Action:
                  - "dynamodb:CreateTable"
                  - "dynamodb:DeleteTable"
                  - "dynamodb:DescribeTable"
                  - "dynamodb:ListTables"
                Resource: !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/plot-db-*"
              - Sid: CloudFrontServiceLinkedRole
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource: "arn:aws:iam::*:role/aws-service-role/cloudfront.amazonaws.com/*"
                Condition:
                  StringLike:
                    "iam:AWSServiceName": "cloudfront.amazonaws.com"

Outputs:
  RoleArn:
    Description: ARN of the Plot cross-account role. Paste this into Plot.
    Value: !GetAtt PlotRole.Arn
